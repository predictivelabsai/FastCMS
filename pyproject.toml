[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fasthtml-cms"
version = "0.1.0"
description = "A modern, lightweight CMS built with FastHTML, with PostgreSQL or SQLite storage"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Predictive Labs Ltd", email = "info@predictivelabs.ai"},
]
keywords = ["cms", "fasthtml", "postgresql", "sqlite", "htmx", "content-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: Content Management System",
]
dependencies = [
    "fastapi>=0.115",
    "python-fasthtml>=0.12.0",
    "fastlite>=0.1.0",
    "python-multipart>=0.0.9",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.1.0",
    "itsdangerous>=2.1.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
auth = ["msal>=1.28", "ldap3>=2.9"]

[project.urls]
Homepage = "https://github.com/predictivelabs/FastHTML-CMS"
Documentation = "https://github.com/predictivelabs/FastHTML-CMS#readme"
Repository = "https://github.com/predictivelabs/FastHTML-CMS"
Demo = "https://fastcms.predictivelabs.ai"

[tool.setuptools.packages.find]
include = ["app*", "admin*"]
